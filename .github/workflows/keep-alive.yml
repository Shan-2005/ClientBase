name: ClientBase Keep-Alive

on:
  schedule:
    # Runs every 10 minutes, 24/7
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping ClientBase
        run: |
          curl -s https://clientbase.onrender.com/v1/health
          echo "Pulse sent at $(date)"
